# Spring Boot Application Configuration
spring:
  application:
    name: first-main

  # Database Configuration (MySQL 8)
  datasource:
    url: jdbc:mysql://localhost:3306/first_main?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: root
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  # Jackson
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# OpenAPI / Springdoc Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  info:
    title: First Main API
    version: 1.0.0
    description: First Main Backend API Documentation

# Server Configuration
server:
  port: 8080

# Logging
logging:
  level:
    root: INFO
    com.firstmain: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
